<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore actual screen captures from the VW Golf Mk7 MIB2 Standard Java HMI emulator.">
  <meta name="theme-color" content="#101820">
  <title>VW MIB2 Emulator · Screen preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      color: #edf3f8;
      background: #101820;
      --line: #344452;
      --muted: #a3b2be;
      --blue: #7ad9ef;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at 78% 4%, #243949 0, transparent 49%), #101820;
    }
    a { color: inherit; text-underline-offset: 4px; }
    button { font: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
    .wrap { width: min(1200px, calc(100% - 80px)); margin-inline: auto; }
    header { border-bottom: 1px solid var(--line); }
    header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
    }
    .brand { font-weight: 650; letter-spacing: -.02em; }
    .brand span { color: var(--blue); }
    .repo { color: var(--muted); font-size: .88rem; }
    .repo:hover { color: #fff; }
    main { padding-block: 58px 40px; }
    .intro { margin-bottom: 34px; }
    .intro p { color: var(--muted); font-size: 1.05rem; margin: 12px 0 0; }
    h1 {
      font-size: clamp(2.6rem, 6vw, 5rem);
      line-height: .98;
      letter-spacing: -.068em;
      margin: 0;
    }
    .gallery {
      display: grid;
      grid-template-columns: minmax(0, 3.1fr) minmax(224px, 1fr);
      gap: 24px;
      align-items: start;
    }
    figure { margin: 0; min-width: 0; }
    .bezel {
      padding: 12px;
      border: 1px solid #3b4b59;
      border-radius: 15px;
      background: linear-gradient(155deg, #25333e, #151c24 65%);
      box-shadow: 0 22px 42px #050a0e78, inset 0 1px #ffffff1c;
    }
    .bezel img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 5 / 3;
      border-radius: 6px;
      background: #030507;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 3px 0;
      color: var(--muted);
      font-size: .83rem;
      line-height: 1.55;
    }
    .spec { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .controls {
      background: #131f29;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 16px;
    }
    .controls h2 { margin: 2px 4px 14px; font-size: .95rem; }
    .choices { display: grid; gap: 8px; }
    .choices button {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 49px;
      padding: 9px 11px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      background: #1b2935;
      color: #c9d7e1;
      font-size: .87rem;
    }
    .choices button:hover { background: #243949; }
    .choices button[aria-pressed="true"] {
      color: #e7faff;
      border-color: #51798a;
      background: #233f4d;
    }
    .choices button::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: #627889;
    }
    .choices button[aria-pressed="true"]::before { background: var(--blue); }
    .status { margin: 15px 4px 0; font-size: .81rem; color: var(--muted); line-height: 1.55; }
    footer .wrap {
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      padding-block: 20px 25px;
      font-size: .81rem;
      color: var(--muted);
    }
    @media (max-width: 800px) {
      .wrap { width: calc(100% - 40px); }
      main { padding-top: 42px; }
      .gallery { grid-template-columns: 1fr; }
      .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .bezel { padding: 8px; }
    }
    @media (max-width: 400px) {
      .wrap { width: calc(100% - 28px); }
      .controls { padding: 12px; }
      .choices button { font-size: .8rem; padding-inline: 7px; }
      figcaption { flex-direction: column; gap: 1px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand"><span>MIB2</span> Emulator</div>
      <a class="repo" href="https://github.com/mxhm11cr/vw-mib2-emulator">GitHub repository ↗</a>
    </div>
  </header>

  <main class="wrap">
    <div class="intro">
      <h1>Golf Mk7 infotainment</h1>
      <p>Screen captures from the original MIB2 Standard interface running in the emulator.</p>
    </div>

    <div class="gallery">
      <figure>
        <div class="bezel">
          <img id="screen" src="assets/performance.png" width="800" height="480" alt="Three circular gauges in the MIB2 Performance monitor">
        </div>
        <figcaption>
          <span id="caption" aria-live="polite">Performance monitor · Simulated engine and oil data</span>
          <span class="spec">800 × 480 · P0369</span>
        </figcaption>
      </figure>

      <section class="controls" aria-labelledby="screen-heading">
        <h2 id="screen-heading">Choose a screen</h2>
        <div class="choices">
          <button type="button" aria-pressed="true" data-frame="assets/performance.png" data-alt="Three circular gauges in the MIB2 Performance monitor" data-caption="Performance monitor · Simulated engine and oil data">Performance monitor</button>
          <button type="button" aria-pressed="false" data-frame="assets/radio.png" data-alt="FM radio screen with five preset buttons" data-caption="FM radio · Tuner and station presets">FM radio</button>
          <button type="button" aria-pressed="false" data-frame="assets/vehicle.png" data-alt="Vehicle status screen with a rendering of a Golf Mk7" data-caption="Vehicle status · Golf Mk7 and Start-stop information">Vehicle status</button>
          <button type="button" aria-pressed="false" data-frame="assets/efficiency.png" data-alt="Think Blue Trainer with three blue driving efficiency indicators" data-caption="Think Blue. Trainer. · Simulated driving efficiency">Think Blue. Trainer.</button>
        </div>
        <p class="status">Launch the emulator locally for touch input and vehicle controls.</p>
      </section>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>Independent research project</span>
      <a href="https://github.com/mxhm11cr/vw-mib2-emulator/blob/main/docs/SETUP.md">Windows setup ↗</a>
    </div>
  </footer>

  <script>
    const screen = document.querySelector('#screen');
    const caption = document.querySelector('#caption');
    const choices = Array.from(document.querySelectorAll('[data-frame]'));

    for (const choice of choices) {
      choice.addEventListener('click', () => {
        for (const button of choices) {
          button.setAttribute('aria-pressed', String(button === choice));
        }
        screen.src = choice.dataset.frame;
        screen.alt = choice.dataset.alt;
        caption.textContent = choice.dataset.caption;
      });
    }
  </script>
</body>
</html>
